[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catbots"
version = "0.1.0"
description = "Statistical reaction-space reduction and benchmark oracles for low-data reaction optimisation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas<3",  # pandas 3 changes DataFrame.stack (duplicate-column error in the pipeline)
    "rdkit",
    "scikit-learn",
    "scipy",
    "shap",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["catbots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
